version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unisphere_postgres
    environment:
      POSTGRES_DB: unisphere_db
      POSTGRES_USER: unisphere_user
      POSTGRES_PASSWORD: unisphere_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisphere_user -d unisphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unisphere_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: unisphere_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://unisphere_user:unisphere_password@postgres:5432/unisphere_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: unisphere_web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

  ai:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    container_name: unisphere_ai_service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./ai:/app
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
